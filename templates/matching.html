{% extends 'base.html' %}{% block content %}<div class="card p-4"><h4>Transparent Matching</h4><form><select name="adopter_id" class="form-select mb-3">{% for a in adopters %}<option value="{{a.adopter_id}}">{{a.full_name}}</option>{% endfor %}</select><button class="btn btn-primary">Find Matches</button></form>{% if selected %}<hr><table class="table"><tr><th>Animal</th><th>Species</th><th>Size</th><th>Health</th><th>Shelter</th></tr>{% for m in matches %}<tr><td>{{m.name}}</td><td>{{m.species}}</td><td>{{m.size}}</td><td>{{m.health_status}}</td><td>{{m.shelter_name}}</td></tr>{% endfor %}</table>{% endif %}</div>{% endblock %}
